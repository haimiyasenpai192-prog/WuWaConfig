name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan proyek (unzip kalau masih berupa zip)
        run: |
          if [ ! -f settings.gradle.kts ] && [ -f WuWaConfig.zip ]; then
            unzip -q WuWaConfig.zip
            cp -r WuWaConfig/. .
          fi

      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK release
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WaveConfig-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
