name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan proyek (unzip kalau masih berupa zip)
        run: |
          if [ ! -f settings.gradle.kts ] && [ -f WuWaConfig.zip ]; then
            unzip -q WuWaConfig.zip
            cp -r WuWaConfig/. .
          fi

      - name: Salin config ke dalam APK
        run: |
          mkdir -p app/src/main/assets/presets
          shopt -s nullglob
          for f in configs/*.zip; do cp "$f" app/src/main/assets/presets/; done
          ls -la app/src/main/assets/presets

      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK release
        run: gradle assembleRelease --no-daemon --stacktrace -PappVersionCode=${{ github.run_number }} -PappVersionName=1.${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wavetune-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Buat release (untuk fitur Cek pembaruan)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Wavetune.apk
          gh release create "v${{ github.run_number }}" Wavetune.apk --repo "${{ github.repository }}" --title "Wavetune 1.${{ github.run_number }}" --notes "Pembaruan otomatis. Config terbaru sudah ikut di dalam APK." --latest
